[project]
name = "afac2026"
version = "0.1.0"
description = "AFAC2026竞赛项目"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "optuna>=3.0.0",
    "dashscope>=1.20.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"
